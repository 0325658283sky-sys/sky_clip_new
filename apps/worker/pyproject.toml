[project]
name = "skycut-worker"
version = "0.1.0"
description = "SkyCut 미디어 분석·하이라이트 추출 워커"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# STT 공급자는 M1 비교 실험에서 고른 것만 설치한다
deepgram = ["deepgram-sdk>=3.7"]
elevenlabs = ["elevenlabs>=1.10"]
whisperx = ["whisperx>=3.1", "torch>=2.4"]
dev = ["pytest>=8.3"]

[project.scripts]
skycut-worker = "skycut_worker.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skycut_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../packages/schema/generated"]
